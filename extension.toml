id = "xmake"
name = "XMake"
version = "0.3.0"
schema_version = 1
authors = ["Burak Aksoy ornatus_albifrons@proton.me"]
description = "XMake support for Zed: xmake_ls, syntax highlighting, build tasks, and debug locators"
repository = "https://github.com/xmake-io/xmake-zed"

[language_servers.xmake-ls]
name = "xmake_ls"
languages = ["xmake"]

[debug_locators.xmake]

# Zed will not spawn a process unless it is listed here and granted in settings.
[[capabilities]]
kind = "process:exec"
command = "xmake"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "xmake.exe"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "xmake.cmd"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "xmake.bat"
args = ["**"]

[configuration]
type = "object"
title = "XMake Settings"

[configuration.properties.linuxVariant]
type = "string"
default = "auto"
enum = ["auto", "musl", "x64-glibc.2.17", "x64", "aarch64-glibc.2.17", "riscv64"]
description = "Linux xmake_ls binary variant. Use auto to pick from architecture (x64-glibc.2.17 or aarch64-glibc.2.17)."

[configuration.properties.logLevel]
type = "string"
default = "Info"
enum = ["Error", "Warning", "Info", "Debug", "Trace"]
description = "Language server log level"

[configuration.properties.enableDiagnostics]
type = "boolean"
default = true
description = "Enable diagnostic reporting"

[configuration.properties.enableCompletion]
type = "boolean"
default = true
description = "Enable code completion"

[configuration.properties.enableHover]
type = "boolean"
default = true
description = "Enable hover information"

[configuration.properties.enableCodeActions]
type = "boolean"
default = true
description = "Enable code actions and quick fixes"

[configuration.properties.xmakePath]
type = "string"
default = ""
description = "Path to the xmake executable passed through to xmake_ls. Leave empty and xmake_ls searches PATH. Zed tasks and the debug locator run the `xmake` found on PATH."

[grammars.lua]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-lua"
commit = "d76023017f7485eae629cb60d406c7a1ca0f40c9"
