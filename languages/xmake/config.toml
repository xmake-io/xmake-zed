name = "xmake"
grammar = "lua"
path_suffixes = ["xmake.lua", "lua"]
line_comments = ["-- "]
block_comment = ["--[[", "]]"]
debuggers = ["CodeLLDB", "GDB", "LLDB"]
tab_size = 4
hard_tabs = false

[editor.hover]
enabled = true

[editor.code_actions]
enabled = true

[editor.inlay_hints]
enabled = false
